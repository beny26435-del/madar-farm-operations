// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
  repositories {
    maven {
      url 'https://redirector.gvt1.com/edgedl/android/maven2'
      content {
        includeGroup 'com.android'
        includeGroupByRegex 'androidx\\..*'
        includeGroupByRegex 'com\\.android\\..*'
        includeGroupByRegex 'com\\.google\\.android\\..*'
        includeGroupByRegex 'com\\.google\\.firebase\\..*'
        includeGroupByRegex 'com\\.google\\.gms\\..*'
        includeGroup 'com.google.prefab'
        includeGroupByRegex 'com\\.google\\.testing\\..*'
      }
    }
    google()
    mavenCentral()
  }
  dependencies {
    classpath('com.android.tools.build:gradle')
    classpath('com.facebook.react:react-native-gradle-plugin')
    classpath('org.jetbrains.kotlin:kotlin-gradle-plugin')
  }
}

allprojects {
  repositories {
    maven {
      url 'https://redirector.gvt1.com/edgedl/android/maven2'
      content {
        includeGroup 'com.android'
        includeGroupByRegex 'androidx\\..*'
        includeGroupByRegex 'com\\.android\\..*'
        includeGroupByRegex 'com\\.google\\.android\\..*'
        includeGroupByRegex 'com\\.google\\.firebase\\..*'
        includeGroupByRegex 'com\\.google\\.gms\\..*'
        includeGroup 'com.google.prefab'
        includeGroupByRegex 'com\\.google\\.testing\\..*'
      }
    }
    google()
    mavenCentral()
    maven { url 'https://www.jitpack.io' }
  }
}

// Expo modules with C/C++ code otherwise fall back to AGP's older NDK. Keep
// every native module on the same tested NDK as React Native and the app.
subprojects { subproject ->
  subproject.plugins.withId('com.android.library') {
    subproject.android.ndkVersion rootProject.ext.ndkVersion
    subproject.android.externalNativeBuild.cmake.version '3.30.5'
  }
}

apply plugin: "expo-root-project"
apply plugin: "com.facebook.react.rootproject"
